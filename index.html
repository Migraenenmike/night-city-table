<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0a17">
<title>Night City Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: Netz-Terminal — Kopfleiste mit Reitern, darunter eine Spalte aus angeschnittenen Panels; Würfel erscheinen in einem Vollbild-Würfeltisch. Einheitlich dunkel (bewusst). */
:root{
  --bg:#0e0a17; --bg2:#140f22; --panel:#191330; --panel2:#211a3d; --line:#3b3063;
  --fg:#efe9ff; --muted:#a297cc; --yel:#f5e400; --cyan:#3fe6ff; --mag:#ff2e88;
  --ok:#5dffa0; --bad:#ff4f5e;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Share Tech Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --cut:12px;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;
  background:
    linear-gradient(transparent 0 calc(100% - 1px), rgba(63,230,255,.05) 0) 0 0/100% 28px,
    radial-gradient(1200px 500px at 85% -10%, rgba(255,46,136,.16), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(63,230,255,.10), transparent 60%),
    var(--bg);
  background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(20,15,34,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:18px;color:var(--yel);display:flex;gap:8px;align-items:baseline}
.logo small{font-family:var(--f-mono);color:var(--cyan);font-size:12px;letter-spacing:.1em}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;padding:6px 12px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);cursor:pointer}
nav button[aria-current="true"]{color:var(--bg);background:var(--yel);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
nav button:hover:not([aria-current="true"]){color:var(--fg);border-color:var(--line)}
.who{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:100%;display:flex;gap:12px;flex-wrap:wrap}
.who b{color:var(--cyan);font-weight:400}

main{max-width:1120px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}

.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:18px;position:relative;min-width:0;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.panel.hot{border-color:var(--yel)}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,4vw,34px);color:var(--yel)}
h2{font-size:18px;color:var(--yel);display:flex;gap:10px;align-items:center}
h2 .tag{font-family:var(--f-mono);font-size:11px;color:var(--cyan);letter-spacing:.12em;border:1px solid var(--line);padding:1px 6px}
h3{font-size:14px;color:var(--cyan)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

input,select,textarea{background:var(--bg);border:1px solid var(--line);padding:8px 10px;width:100%;min-width:0;border-radius:0}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);outline:none}
.field{display:grid;gap:4px;min-width:0}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;cursor:pointer;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.primary{background:var(--yel);color:#120d00;border-color:var(--yel);font-weight:700;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn.primary:hover{background:#fff35a;color:#120d00}
.btn.mag{border-color:var(--mag);color:var(--mag)}
.btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:520px){.stats{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}}
.stat{background:var(--bg);border:1px solid var(--line);padding:6px 4px;text-align:center;min-width:0}
.stat .k{font-family:var(--f-mono);font-size:11px;color:var(--cyan);letter-spacing:.08em}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .ctl{display:flex;justify-content:center;gap:2px}
.stat .ctl button{background:none;border:1px solid var(--line);width:24px;height:22px;cursor:pointer;padding:0;line-height:1}
.stat .ctl button:hover{border-color:var(--yel);color:var(--yel)}

.meter{height:10px;background:var(--bg);border:1px solid var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--mag),var(--yel))}
.meter.hum i{background:linear-gradient(90deg,var(--cyan),#9b7bff)}
.vital{display:grid;gap:4px}
.vital .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.num{font-family:var(--f-display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}

.inv{display:grid;gap:6px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);padding:8px 10px;min-width:0}
.item .q{font-family:var(--f-mono);color:var(--yel);min-width:30px}
.item .n{min-width:0;overflow-wrap:anywhere}
.item .n small{display:block;color:var(--muted);font-size:12px}
.item .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mob{border-top:1px dashed var(--line);padding-top:10px}
.mob .item.hit{border-color:var(--mag);box-shadow:inset 3px 0 0 var(--mag)}
.mob .item.miss{opacity:.75}
.mob .item.miss .q{color:var(--muted)}
.tgtsel{width:auto;max-width:150px;padding:4px 6px;font-size:13px}
.item.cat{grid-template-columns:1fr auto}
.give{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.give select{flex:1 1 160px;width:auto}
.empty{border:1px dashed var(--line);padding:14px;color:var(--muted);text-align:center}

.chip{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border:1px solid var(--line);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chip.dm{border-color:var(--mag);color:var(--mag)}
.chip.you{border-color:var(--cyan);color:var(--cyan)}

.dicepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.dpick{background:var(--bg);border:1px solid var(--line);padding:10px 4px 8px;cursor:pointer;display:grid;justify-items:center;gap:4px;font-family:var(--f-display);font-size:14px}
.dpick svg{width:40px;height:40px}
.dicepick.main{grid-template-columns:1fr 1fr}
.dicepick.main .dpick{padding:14px 6px 10px;font-size:17px}.dicepick.main .dpick svg{width:56px;height:56px}
.dpick small{font-family:var(--f-body);font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0}
.moredice summary{cursor:pointer;color:var(--muted);font-size:13px;padding:2px 0}
.moredice[open] summary{margin-bottom:8px}
.dpick:hover,.dpick[aria-pressed="true"]{border-color:var(--yel);color:var(--yel)}
.dpick:hover svg polygon,.dpick[aria-pressed="true"] svg polygon,.dpick[aria-pressed="true"] svg rect{stroke:var(--yel)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);width:max-content}
.stepper button{background:none;border:0;width:34px;height:36px;cursor:pointer;font-size:18px}
.stepper span{min-width:34px;text-align:center;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}

.log{display:grid;gap:4px;max-height:420px;overflow:auto}
.log .e{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 10px;background:var(--bg);border-left:3px solid var(--line);min-width:0}
.log .e.crit{border-left-color:var(--ok)}
.log .e.fumble{border-left-color:var(--bad)}
.log .e .t{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--yel);font-variant-numeric:tabular-nums}
.log .e .d{font-size:13px;min-width:0;overflow-wrap:anywhere}
.log .e .d small{color:var(--muted);font-family:var(--f-mono)}

.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.pc{background:var(--bg);border:1px solid var(--line);padding:12px;display:grid;gap:8px;min-width:0}
.pc .name{font-family:var(--f-display);font-size:18px;font-weight:700;overflow-wrap:anywhere}

.notice{border:1px solid var(--mag);background:rgba(255,46,136,.08);padding:12px 14px}
.pts{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--yel);font-variant-numeric:tabular-nums}
.pts.over{color:var(--bad)}

/* Würfeltisch */
#tray{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,5,16,.82);backdrop-filter:blur(4px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tray-in{width:min(680px,100%);display:grid;gap:18px;justify-items:center;text-align:center;
  background:linear-gradient(180deg,#1d1638,#120d22);border:1px solid var(--yel);padding:26px 18px;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
  box-shadow:0 0 60px rgba(245,228,0,.15)}
.tray-who{font-family:var(--f-mono);color:var(--cyan);letter-spacing:.12em;text-transform:uppercase;font-size:13px}
.tray-dice{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;min-height:120px;align-items:center;perspective:700px;
  background:repeating-linear-gradient(90deg,rgba(63,230,255,.06) 0 1px,transparent 1px 30px),repeating-linear-gradient(0deg,rgba(63,230,255,.06) 0 1px,transparent 1px 30px);
  width:100%;padding:20px 8px}
.tray-dice.is3d{display:block;padding:0;height:min(300px,42vh);background:none;border:1px solid var(--line)}
.tray-dice.is3d canvas{width:100%;height:100%;display:block}
.tray-total{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;color:var(--yel);font-variant-numeric:tabular-nums;min-height:56px}
.tray-total.glitch{animation:glitch .5s steps(2) 1}
.tray-note{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;min-height:1.5em}
.tray-note.crit{color:var(--ok)} .tray-note.fumble{color:var(--bad)}
.tray-sub{font-family:var(--f-mono);color:var(--muted);font-size:13px;min-height:1.2em}
@keyframes glitch{0%{text-shadow:3px 0 var(--mag),-3px 0 var(--cyan);transform:translateX(-2px)}50%{text-shadow:-4px 0 var(--mag),4px 0 var(--cyan);transform:translateX(3px)}100%{text-shadow:none;transform:none}}

.pdie{width:92px;height:92px;position:relative;display:grid;place-items:center;transform-style:preserve-3d}
.pdie.rolling{animation:tumble var(--dur,1.4s) cubic-bezier(.2,.7,.3,1) both}
.pdie svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pdie svg polygon,.pdie svg circle{fill:#221a44;stroke:var(--cyan);stroke-width:2.5}
.pdie svg .inner{fill:none;stroke:rgba(63,230,255,.35);stroke-width:1.5}
.pdie .val{position:relative;font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;color:var(--fg)}
.pdie.small .val{font-size:22px}
.pdie.landed svg polygon{stroke:var(--yel);filter:drop-shadow(0 0 10px rgba(245,228,0,.7))}
.pdie.landed .val{color:var(--yel)}
.pdie.crit svg polygon{stroke:var(--ok);filter:drop-shadow(0 0 12px rgba(93,255,160,.8))}
.pdie.crit .val{color:var(--ok)}
.pdie.fumble svg polygon{stroke:var(--bad);filter:drop-shadow(0 0 12px rgba(255,79,94,.8))}
.pdie.fumble .val{color:var(--bad)}
@keyframes tumble{
  0%{transform:translate3d(var(--sx),-160px,0) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz)) scale(.6);opacity:0}
  12%{opacity:1}
  45%{transform:translate3d(calc(var(--sx) * -.3),20px,0) rotateX(calc(var(--rx) * .35)) rotateY(calc(var(--ry) * .35)) rotateZ(calc(var(--rz) * .4)) scale(1.05)}
  65%{transform:translate3d(calc(var(--sx) * .1),-26px,0) rotateX(calc(var(--rx) * .1)) rotateY(calc(var(--ry) * .1)) rotateZ(calc(var(--rz) * .12)) scale(1)}
  82%{transform:translate3d(0,6px,0) rotateX(0) rotateY(0) rotateZ(calc(var(--rz) * .02))}
  100%{transform:none;opacity:1}
}
/* echter W6-Würfel */
.cube-wrap{width:80px;height:80px;perspective:500px}
.cube-wrap.rolling{animation:hop var(--dur,1.4s) cubic-bezier(.2,.7,.3,1) both}
@keyframes hop{0%{transform:translate3d(var(--sx),-160px,0) scale(.6);opacity:0}12%{opacity:1}45%{transform:translate3d(calc(var(--sx) * -.3),20px,0)}65%{transform:translate3d(calc(var(--sx) * .1),-24px,0)}82%{transform:translateY(5px)}100%{transform:none}}
.cube{width:80px;height:80px;position:relative;transform-style:preserve-3d}
.face{position:absolute;inset:0;background:#221a44;border:2.5px solid var(--cyan);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;backface-visibility:hidden}
.face i{width:12px;height:12px;border-radius:50%;background:var(--fg);place-self:center}
.cube.landed .face{border-color:var(--yel);box-shadow:0 0 14px rgba(245,228,0,.45) inset}
.cube.landed .face i{background:var(--yel)}

.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.rule{background:var(--bg);border:1px solid var(--line);padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.rule h3{display:flex;gap:8px;align-items:baseline}
.rule p,.rule ul{margin:0}
.rule ul{padding-left:18px;display:grid;gap:4px}
.rule b{color:var(--yel);font-weight:600}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl td,.tbl th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:400}
.tbl td.n{font-family:var(--f-display);font-weight:700;color:var(--yel);font-variant-numeric:tabular-nums;text-align:right;width:1%;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);width:fit-content;max-width:100%}
.stack>*{min-width:0}
.seg button{background:none;border:0;padding:8px 16px;cursor:pointer;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#06121a}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.skg{display:grid;gap:4px;align-content:start}
.sk{display:flex;gap:6px;align-items:center;min-width:0}
.skroll{flex:1;min-width:0;display:flex;justify-content:space-between;gap:8px;background:var(--bg);border:1px solid var(--line);padding:5px 9px;cursor:pointer;text-align:left}
.skroll:hover{border-color:var(--yel);color:var(--yel)}
.sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sb{font-family:var(--f-display);color:var(--yel);font-weight:700;font-variant-numeric:tabular-nums}
.sk.zero .sn{color:var(--muted)}
.mini{display:flex;align-items:center;border:1px solid var(--line);flex:none}
.mini button{background:none;border:0;width:24px;height:30px;cursor:pointer}
.mini button:hover{color:var(--yel)}
.mini span{min-width:18px;text-align:center;font-family:var(--f-mono)}
.wpn{display:grid;gap:8px;background:var(--bg);border:1px solid var(--line);padding:10px;min-width:0}
.wpn .n{overflow-wrap:anywhere}
.wpn small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.wpn .acts{display:flex;gap:6px;flex-wrap:wrap}
.combat{border-color:var(--mag);background:linear-gradient(180deg,#2a1534,var(--panel))}
.turn{font-size:17px}
.turn b{color:var(--yel);font-family:var(--f-display);font-size:20px}
.order{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.order li{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);padding:6px 10px;flex-wrap:wrap}
.order li.cur{border-color:var(--yel);box-shadow:inset 4px 0 0 var(--yel)}
.order .ini{font-family:var(--f-display);font-weight:700;color:var(--cyan);min-width:28px;font-variant-numeric:tabular-nums}
.order .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.order li.npc .nm{color:var(--mag)}
.order .acts{display:flex;gap:4px}
.note .body{white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch}
.note.secret{border-style:dashed}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);color:var(--muted)}
.steps li.on{border-color:var(--yel);color:var(--yel)}
.steps li.done{color:var(--cyan);border-color:var(--cyan)}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.rolec{background:var(--bg);border:1px solid var(--line);padding:12px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start}
.rolec:hover{border-color:var(--cyan)}
.rolec[aria-pressed="true"]{border-color:var(--yel);box-shadow:inset 0 0 0 1px var(--yel)}
.rolec b{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--yel)}
.rolec span{font-size:13px;color:var(--muted)}
.rolec em{font-style:normal;font-size:12px;color:var(--cyan);font-family:var(--f-mono)}
.lp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.sum>.stack{align-content:start}
.sum ul{margin:0;padding-left:18px;display:grid;gap:2px}
.rating{display:grid;gap:6px;background:var(--bg);border:1px solid var(--line);padding:12px}
.rating .big{font-family:var(--f-display);font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.rating.easy .big{color:var(--ok)} .rating.mid .big{color:var(--yel)} .rating.hard .big{color:#ffa23f} .rating.deadly .big{color:var(--bad)}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.scale i{height:8px;background:var(--line)}

/* --- Cyberware nach Körperteilen --- */
const CZONES=[["neural","Neural",1,"Neural Link","Keine Neural Link"],["eye","Augen",2,"Cybereye","Kein Cybereye"],["audio","Ohren",1,"Cyberaudio Suite","Keine Cyberaudio Suite"],["arm","Arme",2,"Cyberarm","Kein Cyberarm"],["leg","Beine",2,"Cyberleg","Kein Cyberleg"],["internal","Körper innen",0],["external","Körper aussen",0],["fashion","Mode",0]];
const SIDES=["links","rechts"];
function cyberCheck(c,e){
  const z=CZONES.find(x=>x[0]===e.zone);if(!z)return "";
  const cy=c.cyber||[],bases=cy.filter(x=>x.zone===e.zone&&x.kind==="base");
  if(e.kind==="base"){if(bases.length>=z[2])return z[2]===1?`${z[3]} ist schon eingebaut.`:`Beide Seiten haben schon ein ${z[3]}.`;return ""}
  if(e.kind==="opt"){if(!bases.length)return `Dafür brauchst du zuerst ein Grundmodul: ${z[3]}.`;
    if(e.pair&&bases.length<2)return `${e.name} braucht zwei ${z[3]==="Cyberarm"?"Cyberarme":"Cyberbeine"}.`;
    if(!bases.some(b=>cy.filter(o=>o.parent===b.id).length<(b.slots||0)))return `Alle Plätze im Grundmodul ${z[3]} sind belegt.`}
  return "";
}
function installCyber(c,e,name){
  c.cyber=c.cyber||[];const cy=c.cyber,it={id:uid(),name:name||e.name,note:e.note||"",hl:e.hl||0,zone:e.zone||"",kind:e.kind||""};
  if(e.kind==="base"){const used=cy.filter(x=>x.zone===e.zone&&x.kind==="base").map(x=>x.side);it.side=SIDES.find(s=>!used.includes(s))||"";it.slots=e.slots||0}
  if(e.kind==="opt"){const b=cy.filter(x=>x.zone===e.zone&&x.kind==="base").find(b=>cy.filter(o=>o.parent===b.id).length<(b.slots||0));if(b)it.parent=b.id}
  cy.push(it);c.hum=Math.max(0,(c.hum||0)-(e.hl||0));c.stats.EMP=Math.min(c.stats.EMP,Math.floor(c.hum/10));
}
function uninstallCyber(c,id){
  const cy=c.cyber||[],x=cy.find(v=>v.id===id);if(!x)return;const out=[x,...cy.filter(o=>o.parent===id)];

function makePortrait(file){return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type||"")){rej(new Error("type"));return}
  const fr=new FileReader();fr.onerror=()=>rej(new Error("read"));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("img"));im.onload=()=>{
    const S=128,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d");
    const s=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-s)/2,sy=Math.max(0,(im.naturalHeight-s)*.3);
    x.beginPath();x.arc(S/2,S/2,S/2,0,Math.PI*2);x.closePath();x.clip();x.imageSmoothingQuality="high";x.drawImage(im,sx,sy,s,s,0,0,S,S);
    let url=c.toDataURL("image/webp",.86);if(!url.startsWith("data:image/webp"))url=c.toDataURL("image/png");res(url)};im.src=fr.result};
  fr.readAsDataURL(file)})}

function moveCheck(src,dst){

let drag=null,holdT=null;
function startDrag(x,y){const d=drag;d.on=true;const r=d.card.getBoundingClientRect();
  const gh=d.card.cloneNode(true);gh.classList.add("ghost");gh.style.width=r.width+"px";gh.style.left=r.left+"px";gh.style.top=r.top+"px";document.body.appendChild(gh);
  d.gh=gh;d.dx=x-r.left;d.dy=y-r.top;d.card.style.opacity=".35";document.body.classList.add("dragging");try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function moveDrag(x,y){const d=drag;d.gh.style.left=(x-d.dx)+"px";d.gh.style.top=(y-d.dy)+"px";
  const t=document.elementFromPoint(x,y)?.closest("[data-drop]");
  if(d.over!==t){d.over?.classList.remove("over");t?.classList.add("over");d.over=t}
  if(y<70)window.scrollBy(0,-12);else if(y>innerHeight-((document.getElementById("dock")||{}).offsetHeight||0)-40)window.scrollBy(0,12);}
document.addEventListener("pointerdown",e=>{
  const g=e.target.closest("[data-drag]");if(!g||e.button>0||e.target.closest("button,input,select,textarea,a,label"))return;
  drag={src:g.dataset.drag,card:g,x:e.clientX,y:e.clientY,on:false,touch:e.pointerType!=="mouse"};
  if(drag.touch){clearTimeout(holdT);g.classList.add("holding");holdT=setTimeout(()=>{if(drag&&!drag.on){g.classList.remove("holding");startDrag(drag.lx??drag.x,drag.ly??drag.y)}},260)}
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;drag.lx=e.clientX;drag.ly=e.clientY;
  if(!drag.on){const dist=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
    if(drag.touch){if(dist>10){clearTimeout(holdT);drag.card.classList.remove("holding");drag=null}return}
    if(dist<6)return;startDrag(e.clientX,e.clientY)}
  e.preventDefault();moveDrag(e.clientX,e.clientY);
},{passive:false});
document.addEventListener("touchmove",e=>{if(drag&&drag.on)e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",e=>{if(drag)e.preventDefault()});
function endDrag(e,cancel){
  clearTimeout(holdT);if(!drag)return;const d=drag;drag=null;d.card.classList.remove("holding");
  if(d.on){d.gh.remove();d.card.style.opacity="";document.body.classList.remove("dragging");d.over?.classList.remove("over");
    const x=e.clientX??d.lx,y=e.clientY??d.ly;const t=!cancel&&document.elementFromPoint(x,y)?.closest("[data-drop]");if(t)doMove(d.src,t.dataset.drop);
    const stop=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener("click",stop,{capture:true,once:true});setTimeout(()=>document.removeEventListener("click",stop,{capture:true}),50)}

}

function crewMetrics(){
  const cs=Object.values(chars);if(!cs.length)return null;
  let hp=0,sp=0,dpr=[],bases=[];
  cs.forEach(c=>{hp+=c.hp||0;sp+=((c.armor||{}).body||{sp:0}).sp;
    const ws=c.weapons||[];let best={base:10,dmg:"3W6"};ws.forEach(w=>{const b=wBase(c,w).base;if(avgDmg(w.dmg)+b>avgDmg(best.dmg)+best.base)best={base:b,dmg:w.dmg}});
    bases.push(best.base);dpr.push(best)});
  return{n:cs.length,hp,sp:sp/cs.length,best:dpr,base:bases.reduce((a,b)=>a+b,0)/bases.length};
}
function rateEncounter(list){
  const C=crewMetrics();if(!C||!list.length)return null;
  const fHP=list.reduce((a,f)=>a+f.hp,0),fSP=list.reduce((a,f)=>a+f.sp,0)/list.length;
  const crewDPR=C.best.reduce((a,b)=>{const f=list[0];const dv=Math.max(13,(list.reduce((s,x)=>s+(x.dodge||0),0)/list.length)+5.5);return a+pHit(b.base,dv)*Math.max(1,avgDmg(b.dmg)-fSP)},0);
  const foeDPR=list.reduce((a,f)=>a+pHit(f.atk,13)*Math.max(1,avgDmg(f.dmg)-C.sp),0);
  const win=fHP/crewDPR,half=(C.hp*.5)/foeDPR,ratio=win/half;
  const lvl=ratio<.4?["easy","Leicht"]:ratio<.8?["mid","Mittel"]:ratio<1.3?["hard","Schwer"]:["deadly","Tödlich"];
  const pts=list.reduce((a,f)=>a+f.pts,0);
  const tips=[];
  const crewAvg=C.best.reduce((a,b)=>a+avgDmg(b.dmg),0)/C.n;
  if(fSP>=crewAvg-3)tips.push("Die Armor der Gegner schluckt fast jeden Treffer. Senke die SP, gib der Crew panzerbrechende Munition oder einen Kopfschuss-Vorteil.");
  if(avgDmg(list[0].dmg)-C.sp<=2)tips.push("Die Gegner kommen kaum durch die Armor der Crew. Für mehr Druck: Schrotflinten, Sturmgewehre oder Granaten.");
  if(lvl[0]==="easy")tips.push("Zu leicht für Spannung. Füge Mook hinzu oder lass die Gegner aus guter Deckung schiessen.");
  if(lvl[0]==="deadly")tips.push("Plane einen Ausweg ein: Flucht, Verstärkung für die Crew, Verhandlung oder Gegner, die bei halben HP aufgeben.");
  if(list.some(f=>f.tier==="Boss"||f.tier==="Mini-Boss")&&list.length<3)tips.push("Ein Boss allein wird schnell zusammengeschossen. Gib ihm zwei oder drei Mook als Schild.");
  if(list.length>C.n*3)tips.push("Viele Gegner bremsen den Spielfluss. Fasse Mook zu Gruppen zusammen, die gemeinsam würfeln.");
  tips.push("Faustregel: erste Sitzung Leicht bis Mittel, Finale Schwer. Tödlich nur, wenn die Crew fliehen kann.");
  return{lvl,win,half,pts,C,tips};
}
/* --- Encounter-Generator --- */
const ENC_THEMES=[["gang","Gang","booster,thug","enforcer","psycho"],["corpo","Konzern-Sicherheit","sec","solo,runner","elite"],["net","Netrunner mit Wachen","thug,sec","runner","solo"],["psycho","Cyberpsycho-Jagd","booster","enforcer","psycho"],["mix","Gemischt","booster,thug,sec","enforcer,runner,solo","psycho,elite"]];
const ENC_TARGETS=[["easy","Leicht",.2,.4],["mid","Mittel",.45,.8],["hard","Schwer",.85,1.3],["deadly","Tödlich",1.35,2]];
let encGen={theme:"gang",target:"mid"};
function encRatio(list){const R=rateEncounter(list);return R?R.win/R.half:0}
function mkFoe(k,list,power){const base=FOES.find(f=>f.k===k)||FOES[0],F=foeStats(base,power||0),same=list.filter(x=>x.base===base.n).length;return{...F,base:base.n,name:`${base.n} ${same+1}`}}
function renumber(list){const cnt={};list.forEach(f=>{const n=(cnt[f.base]=(cnt[f.base]||0)+1);if(/ \d+$/.test(f.name)||f.name===f.base)f.name=f.base+" "+n});return list}
function generateEncounter(){
  const th=ENC_THEMES.find(x=>x[0]===encGen.theme)||ENC_THEMES[0],tg=ENC_TARGETS.find(x=>x[0]===encGen.target)||ENC_TARGETS[1];
  const mooks=th[2].split(","),leads=th[3].split(","),bosses=th[4].split(",");
  if(!crewMetrics())return null;
  let best=null;
  for(let attempt=0;attempt<40;attempt++){
    const list=[];
    if(tg[0]==="deadly"&&Math.random()<.7)list.push(mkFoe(pickOne(bosses),list));
    else if((tg[0]==="hard"||tg[0]==="deadly")||Math.random()<.4)list.push(mkFoe(pickOne(leads),list));
    for(let n=0;n<14;n++){
      const r=encRatio(list);if(list.length&&r>=tg[2])break;
      const pool=Math.random()<.8?mooks:leads;let added=false;
      for(const k of [...pool].sort(()=>Math.random()-.5)){const tryL=[...list,mkFoe(k,list)];if(encRatio(tryL)<=tg[3]){list.push(tryL[tryL.length-1]);added=true;break}}
      if(!added){const p=list.findIndex(f=>f.tier==="Mook");if(p<0)break;const w=[...list];w[p]=mkFoe(w[p].k,w,-1);if(encRatio(w)<=tg[3]){list.splice(0,list.length,...w)}break}
    }
    const r=encRatio(list),score=r>=tg[2]&&r<=tg[3]?0:Math.min(Math.abs(r-tg[2]),Math.abs(r-tg[3]));
    if(list.length&&(!best||score<best.score||(score===best.score&&Math.random()<.3)))best={list,score};
    if(best&&best.score===0&&attempt>4)break;
  }
  return best?renumber(best.list):null;
}

function foldInits(){
  if(!isDM()||folding||!db||!(combat.active||combat.phase==="init"))return;
  const o=combat.order||[],f=combat.fight;
  const need=Object.entries(inits).filter(([id,v])=>v.fight===f&&chars[id]&&(o.find(x=>x.ref===id)||{init:null}).init==null);
  if(!need.length)return;

  write("game/combat",g=>{if(!g||g.fight!==f)return null;g.order=g.order||[];let ch=false;
    need.forEach(([id,v])=>{let e=g.order.find(x=>x.ref===id);if(!e){e=pcEntry(id,chars[id],false);g.order.push(e)}if(e.init==null){e.init=v.init;ch=true}});

}

function mobTargets(){const o=combat.order||[],alive=id=>chars[id]&&(chars[id].hp||0)>0;const ids=o.filter(x=>x.kind==="pc"&&x.ref&&alive(x.ref)).map(x=>x.ref);return ids.length?ids:Object.keys(chars).filter(alive)}

  if(dmEdit&&tool!=="move"){const em=editMap();
    if(tool==="room"||tool==="road"||tool==="bridge"){mact={kind:tool==="room"?"rect":tool,a:[cx,cy],b:[cx,cy]};drawMap();return}
    if(tool==="spawn"){if(cx>=0&&cy>=0&&cx<m.w&&cy<m.h){const i=cy*m.w+cx,k=em.spawn.indexOf(i);k>=0?em.spawn.splice(k,1):em.spawn.push(i);drawMap();saveMapSoon()}mact=null;return}
    mact={kind:"paint",last:cy*m.w+cx};paintAt(em,cx,cy);return}
  const t=tokenAt(m,cx,cy);

  mact={kind:"pan",sx:e.clientX,sy:e.clientY,ox:mapView.ox,oy:mapView.oy,moved:false,cx,cy,tok:t&&t.id};
  if(e.pointerType!=="mouse"){const a0=mact,ev={clientX:e.clientX,clientY:e.clientY};setTimeout(()=>{if(mact===a0&&!a0.moved&&mptr.size===1){if(navigator.vibrate)try{navigator.vibrate(15)}catch(er){}ptrStart(ev)}},450)}

document.addEventListener("pointermove",e=>{

  if(mact.kind==="pinch"&&mptr.size===2){const p=[...mptr.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),r=$("#mapCanvas").getBoundingClientRect();
    const z=clamp(mact.z*d/mact.d,.25,4),mx=(p[0].x+p[1].x)/2-r.left,my=(p[0].y+p[1].y)/2-r.top,omx=mact.mx-r.left,omy=mact.my-r.top;
    mapView.zoom=z;mapView.ox=mx-(omx-mact.ox)*z/mact.z;mapView.oy=my-(omy-mact.oy)*z/mact.z;drawMap();return}
  if(mact.kind==="ptr"){const q=ptrAt(e);if(q){ptrFeed("me",q);ptrSend(q)}return}
  const [cx,cy,lx,ly]=cellAt(e);
  if(mact.kind==="pan"){const dx=e.clientX-mact.sx,dy=e.clientY-mact.sy;if(Math.hypot(dx,dy)>4)mact.moved=true;mapView.ox=mact.ox+dx;mapView.oy=mact.oy+dy;drawMap()}
  else if(mact.kind==="tok"){mact.px=lx;mact.py=ly;if(Math.hypot(lx-mact.sx,ly-mact.sy)>5)mact.moved=true;if(mact.moved){const [fx,fy]=s2c(lx,ly);liveSend({id:mact.id,map:m.id,x:fx,y:fy})}drawMap()}
  else if(mact.kind==="paint"){const i=cy*m.w+cx;if(i!==mact.last){mact.last=i;paintAt(editMap(),cx,cy)}}
  else if(mact.kind==="rect"||mact.kind==="road"||mact.kind==="bridge"){mact.b=[cx,cy];drawMap()}
});

function mapPointerEnd(e){

  else if(a.kind==="pan"&&!a.moved){lastTap={id:m.id,cx:a.cx,cy:a.cy,t:Date.now()};if(!tapDoor(m,a.cx,a.cy)&&isDM()){mapView.sel=a.tok||null;$("#mapSide").innerHTML=mapSideHtml()}drawMap()}

  else if(a.kind==="bridge"){applyBridge(editMap(),a.a,a.b);drawMap()}
  else drawMap();
}

    rule("Humanity &amp; Cyberware","Chrom",`<ul><li>Jede Cyberware kostet Humanity. Der DM sagt dir, wie viel.</li><li>Pro 10 verlorene Punkte sinkt deine <b>EMP</b> um 1.</li><li>Bei 0 wirst du zum Cyberpsycho und der Charakter gehört dem DM.</li></ul>`),
    rule("Die Roles","Übersicht",`<ul>${ROLES.map(r=>`<li><b>${r}:</b> ${ROLETIPS[r].aufgabe}</li>`).join("")}</ul>`),
    rule("Fortschritt mit IP","Steigern",`<ul><li>Es gibt keine Stufen wie bei D&amp;D. Der DM vergibt <b>Improvement Points (IP)</b>, meist am Ende einer Sitzung.</li><li><b>Skill steigern:</b> neue Stufe × 20 IP. Von 4 auf 5 kostet also 100 IP. Schwere Skills (×2) kosten das Doppelte.</li><li><b>Role Ability steigern:</b> (neuer Rang − 1) × 60 IP, also 240 IP für Rang 5.</li><li><b>×2-Skills</b> (doppelte Kosten): Autofire, Heavy Weapons, Martial Arts, Pilot Air Vehicle, Demolitions, Electronics/Security Tech, Paramedic.</li><li>Grundwerte wie REF oder BODY steigen normalerweise nicht, nur durch Cyberware oder besondere Ereignisse.</li><li>Höchste Stufe ist jeweils 10.</li></ul>`),
    rule("Cyberware &amp; Plätze","Chrom",`<ul><li>Manche Cyberware ist ein <b>Grundmodul</b> mit Plätzen: Neural Link (5), Cybereye (3, eins pro Auge), Cyberaudio Suite (3), Cyberarm (4, eins pro Arm), Cyberleg (3, eins pro Bein).</li><li><b>Optionen</b> brauchen ein passendes Grundmodul und belegen einen Platz. Einige brauchen beide Arme oder Beine.</li><li>Innere und äussere Körperware sowie Mode brauchen keinen Platz, kosten aber Humanity.</li><li>Baust du ein Grundmodul aus, kommen seine Optionen mit in den Rucksack.</li></ul>`),
    rule("Netrunning","Netrunner",`<p>Nur wichtig, wenn jemand einen <b>Netrunner</b> spielt oder der Gig ein gesichertes Netz hat.</p><ul><li>Einstöpseln geht nur in der Nähe eines <b>Access Point</b> (etwa 6 m) mit Cyberdeck und Neural Link.</li><li>Das Netz ist eine <b>NET Architecture</b>: Stockwerke nach unten mit Passwörtern, Dateien, Control Nodes (Kameras, Türen, Geschütze) und <b>Black ICE</b>.</li><li>Im Netz hast du pro Zug mehrere <b>NET Actions</b>: Interface 1–3 = 2, 4–6 = 3, 7–9 = 4, 10 = 5.</li><li>Wichtige Programme-Aktionen: <b>Pathfinder</b> (Karte des Netzes), <b>Backdoor</b> (Passwort knacken), <b>Eye-Dee</b> (Datei erkennen), <b>Control</b> (Gerät übernehmen), <b>Slide</b> (vor ICE fliehen), <b>Zap</b> (ICE angreifen).</li><li>Check: 1W10 + Interface gegen den DV des Netzes (6 leicht, 8 normal, 10 schwer, 12 sehr schwer).</li><li>Black ICE greift dein Deck und deinen Kopf an. Dein Körper steht derweil wehrlos im Raum. Die Crew passt auf dich auf.</li></ul>`),
    rule("Gegenstände","Inventar",`<p>Neue Ausrüstung trägst du im Reiter „Charakter“ ein. Mit <b>Weitergeben</b> schickst du etwas direkt ins Inventar eines anderen Spielers.</p>`)
  ];
  const dm=[
rule("Einen Gig bauen","Ablauf",`<ul><li><b>1. Auftrag:</b> Ein Fixer oder Auftraggeber bietet einen Job an. Ziel, Bezahlung und Frist klar nennen.</li><li><b>2. Beinarbeit:</b> Die Crew sammelt Infos, besorgt Ausrüstung und spricht mit Kontakten.</li><li><b>3. Plan:</b> Lass die Spieler planen. Gib ihnen zwei oder drei Wege zum Ziel.</li><li><b>4. Durchführung:</b> Der Plan trifft auf die Realität, mit Checks, Kämpfen und Hacken.</li><li><b>5. Wendung:</b> Etwas geht schief oder ist anders als gedacht.</li><li><b>6. Zahltag:</b> Bezahlung, Folgen und neue Feinde oder Kontakte.</li></ul>`),
    rule("Was in einen Gig gehört","Inhalt",`<ul><li><b>Auftraggeber</b> mit eigenem Interesse, das nicht ganz offen liegt.</li><li><b>Ziel</b> in einem Satz: holen, schützen, löschen, beweisen, befreien.</li><li><b>Ort</b> mit Atmosphäre und zwei, drei Zonen (Eingang, Inneres, Fluchtweg).</li><li><b>Gegenspieler</b> mit Gesicht und Motiv, nicht nur Mook.</li><li><b>Für jede Role eine Aufgabe:</b> ein System für den Netrunner, ein Gerät für den Tech, eine Verletzung für den Medtech, ein Gespräch für den Fixer, eine Verfolgung für den Nomad.</li><li><b>Zeitdruck</b> und eine <b>moralische Frage</b>, über die die Crew streiten kann.</li></ul>`),
    rule("Gig statt Dungeon","Struktur",`<ul><li>Denk in <b>Szenen</b>, nicht in Räumen: Treffen, Erkundung, Einbruch, Flucht.</li><li>Pro Abend reichen <b>3 bis 5 Szenen</b>. Höchstens ein grosser Kampf, ein bis zwei kleine Konflikte.</li><li>Jede Szene braucht ein Ziel und ein Hindernis. Wer etwas will, würfelt.</li><li>Lösungen der Spieler zulassen, auch wenn du sie nicht geplant hast.</li><li>Ende mit einem Haken: eine offene Frage für die nächste Sitzung.</li></ul>`),
    rule("IP vergeben","Fortschritt",`<ul><li>Pro Sitzung <b>10 bis 30 IP</b> pro Kopf. Für ein grosses Finale bis 100.</li><li>Belohne, was ihr am Tisch sehen wollt: gutes Rollenspiel, clevere Pläne, mutige Entscheidungen.</li><li>Reputation (0 bis 10) steigt mit bekannten Taten und öffnet Türen oder macht Feinde.</li><li>Vergeben geht in der DM-Konsole unter „Improvement Points“.</li></ul>`),
    rule("Bezahlung","Eddies",`<div class="tbl"><table><tbody><tr><td>Kleiner Job (ein Abend)</td><td class="n">200–500 €$</td></tr><tr><td>Normaler Gig</td><td class="n">500–1000 €$</td></tr><tr><td>Grosser Job mit Risiko</td><td class="n">1000–5000 €$</td></tr></tbody></table></div><p class="muted" style="font-size:13px">Pro Kopf. Richtwerte, passe sie an euren Spielstil an. Lass die Crew verhandeln.</p>`),
    rule("So läuft ein Kampf","Schritt für Schritt",`<ol style="margin:0;padding-left:20px;display:grid;gap:6px"><li><b>Vorbereiten:</b> Im Gegner-Creator die Gegner zusammenstellen, die Schwierigkeit prüfen und sie in den Kampf oder versteckt auf die Karte schicken.</li><li><b>Kampf beginnt:</b> Jeder Spieler bekommt ein Fenster und würfelt 1W10 + REF. Die Gegner würfelt die App. Wer fehlt, für den würfelst du oder startest einfach, dann würfelt die App.</li><li><b>Züge:</b> Höchste Initiative zuerst. Jeder hat <b>eine Bewegung</b> und <b>eine Aktion</b>. Mit „Nächster Zug“ gibst du weiter, jede Runde beginnt wieder oben.</li><li><b>Angriff:</b> Fernkampf gegen den DV der Entfernung, Nahkampf gegen das Ausweichen des Ziels (1W10 + DEX + Evasion). Der Angreifer muss <b>höher</b> liegen.</li><li><b>Schaden:</b> Waffenschaden würfeln, SP der getroffenen Zone abziehen, der Rest geht auf die HP. Kommt etwas durch, verliert die Armor 1 SP. Kopfschuss: −8 auf den Angriff, doppelter Schaden nach Armor.</li><li><b>Gegner würfeln:</b> „Auto-Wurf“ bei einem Gegner oder „Alle Gegner würfeln“ für die ganze Bande. Mit „Auto-Wurf, wenn ein Gegner dran ist“ würfelt die App von selbst, sobald ein Gegner am Zug ist.</li><li><b>Verwundet:</b> Unter halben HP −2 auf alles. Unter 1 HP: jede Runde ein Death Save.</li><li><b>Ende:</b> Wenn eine Seite flieht, aufgibt oder fällt. Mook fliehen oft schon bei halber Stärke. Danach Beute verteilen.</li></ol>`),
    rule("Kampf flott halten","Tempo",`<ul><li>Pro Spieler-Zug höchstens eine Minute Bedenkzeit. Wer zögert, geht in Deckung.</li><li>Mook lässt du gemeinsam würfeln, nur Bosse spielst du einzeln aus.</li><li>Beschreib Treffer und Fehlschüsse kurz und bildhaft, nicht nur Zahlen.</li><li>Gib den Gegnern ein Ziel ausser „töten“: Paket sichern, fliehen, Verstärkung rufen. Das macht Kämpfe kürzer und spannender.</li></ul>`),
    rule("NET &amp; ICE einbauen","Netrunning",`<p><b>Braucht ihr das?</b> Nur, wenn jemand einen Netrunner spielt. Ohne Netrunner lässt du Türen, Kameras und Datenbanken mit einem normalen Check (z. B. Electronics/Security Tech) oder einem gekauften Code lösen.</p><ul><li><b>Wo:</b> Ein Gebäude mit wichtigem Ziel hat eine <b>NET Architecture</b>. Leg sie als kleine Liste von Stockwerken an, typisch 3 bis 6 für den Anfang.</li><li><b>Was auf die Stockwerke kommt:</b> Passwort (Backdoor-Check), Datei (das Ziel, Erpressungsmaterial, Codes), Control Node (Kameras, Türen, Geschütze, Lift), <b>Black ICE</b> (Wächterprogramm, das angreift). Die ersten zwei Stockwerke sind die Lobby und harmlos.</li><li><b>DV des Netzes:</b> 6 Hinterhof, 8 Firma, 10 Konzern, 12 Militär oder Arasaka.</li><li><b>Black ICE</b> steigt in die Initiative ein wie ein Gegner und greift Deck und Hirn des Netrunners an. Beliebte Beispiele: Hellhound (brennt), Raven (beschädigt Programme), Wisp (Schaden am Hirn), Kraken (hält fest).</li><li><b>Gleichzeitig spielen:</b> Der Netrunner hackt, die anderen halten Wachen fern. Beide laufen in derselben Initiative. Das ist die Stärke von Netrunning: Wer die Kameras und Geschütze übernimmt, dreht den Kampf.</li><li><b>Belohnung fürs Hacken:</b> Gegner-Positionen aufdecken (auf der Karte den Nebel lüften), Türen öffnen, Geschütze gegen die Wachen drehen, Bonus-Eddies aus Dateien.</li><li><b>Zeitdruck:</b> Nach ein paar Runden merkt die Sicherheit den Eindringling. Dann kommt Verstärkung oder ein Konzern-Netrunner.</li></ul>`),
    rule("Wann würfeln?","Leitung",`<ul><li>Nur würfeln lassen, wenn ein Fehlschlag spannend ist und das Ergebnis unsicher.</li><li>Gegen einen Gegner: beide würfeln, der <b>Angreifer muss höher</b> liegen, Gleichstand gewinnt der Verteidiger.</li><li>Gegen die Umwelt: DV aus der Tabelle wählen.</li></ul>`),
    rule("Schwierigkeiten","DV",dvTable()),
    rule("DV nach Entfernung","Fernkampf",`<div class="tbl"><table><thead><tr><th>Entfernung</th><th style="text-align:right">Pistole</th><th style="text-align:right">Gewehr</th></tr></thead><tbody>
      <tr><td>0–6 m</td><td class="n">13</td><td class="n">17</td></tr><tr><td>7–12 m</td><td class="n">15</td><td class="n">16</td></tr><tr><td>13–25 m</td><td class="n">20</td><td class="n">15</td></tr><tr><td>26–50 m</td><td class="n">25</td><td class="n">13</td></tr><tr><td>51–100 m</td><td class="n">30</td><td class="n">15</td></tr></tbody></table></div><p class="muted" style="font-size:13px">Richtwerte. Andere Waffen liegen dazwischen, Deckung und Sicht erhöhen den DV.</p>`),
    rule("Armor (SP)","Richtwerte",`<div class="tbl"><table><tbody><tr><td>Leder</td><td class="n">4</td></tr><tr><td>Kevlar</td><td class="n">7</td></tr><tr><td>Light Armorjack</td><td class="n">11</td></tr><tr><td>Medium Armorjack</td><td class="n">12</td></tr><tr><td>Heavy Armorjack</td><td class="n">13</td></tr><tr><td>Metalgear</td><td class="n">18</td></tr></tbody></table></div>`),
    rule("Modifikatoren","Situation",`<ul><li>Gutes Werkzeug, Vorbereitung, Hilfe: <b>+1 bis +4</b>.</li><li>Stress, Dunkelheit, Zeitdruck, verletzt: <b>−2 bis −4</b>.</li><li>Ein Helfer mit passender Skill gibt meist <b>+1</b>.</li></ul>`),
    rule("Deine Werkzeuge hier","App",`<ul><li><b>DM-Konsole:</b> alle Stats, HP, Humanity und Inventare der Crew. Stats mit +/− anpassen.</li><li><b>Geben:</b> Beute und Ausrüstung direkt ins Inventar eines Spielers, Eddies an einen oder an alle.</li><li><b>Verdeckt würfeln:</b> Häkchen am Würfeltisch. Der Wurf erscheint nur bei dir.</li><li><b>Protokoll leeren</b> zu Beginn einer neuen Sitzung.</li></ul>`),
    rule("Belohnungen","Nach der Sitzung",`<ul><li>Eddies für erledigte Jobs, typisch einige Hundert pro Kopf und Auftrag.</li><li>Improvement Points für gutes Rollenspiel und Fortschritt, damit steigern Spieler ihre Skills.</li><li>Glückspunkte füllen sich zur nächsten Sitzung auf.</li></ul>`),
    rule("Cyberpsychose","Humanity",`<p>Fällt die Humanity eines Charakters auf 0, übernimmst du ihn als NSC. Vorher Warnzeichen ausspielen und Therapie anbieten, das stellt Humanity wieder her.</p>`)
  ];
  return `<section class="panel hot stack">
    <div class="row" style="justify-content:space-between"><div><span class="label">Spickzettel</span><h1>Regeln</h1></div>
    <div class="seg"><button data-act="rulesfor" data-k="player" aria-pressed="${who==="player"}">Spieler</button><button data-act="rulesfor" data-k="dm" aria-pressed="${who==="dm"}">DM</button></div></div>
    <p class="muted" style="margin:0;max-width:65ch">Vereinfachte Zusammenfassung der Cyberpunk-RED-Kernregeln für den schnellen Blick am Tisch. Im Zweifel gilt das Regelbuch oder das Wort des DM.</p>
  </section>
  <div class="rules">${(who==="dm"?dm:player).join("")}</div>`;
}
function offlineNote(){return`<section class="panel stack"><h2>Keine Verbindung zur Spieldatenbank</h2><p style="max-width:62ch">${offlineReason==="config"?"In der Datei fehlt noch der firebaseConfig-Block. Füge ihn oben im Script ein (siehe Anleitung).":"Die Anmeldung bei Firebase hat nicht geklappt. Ist der Anbieter „Anonym“ unter Authentication aktiviert?"} Würfeln geht trotzdem.</p><div><button class="btn primary" data-tab="dice">Zum Würfeltisch</button></div></section>`}

/* ---------- Aktionen ---------- */
let delArm=null;
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab]");if(t){openTab(t.dataset.tab,t);giveOpen=null;render();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,d=+b.dataset.d||0,id=b.dataset.id;
  if(a==="dstat"){draft.stats[b.dataset.k]=clamp(draft.stats[b.dataset.k]+d,SMIN,SMAX);render()}
  else if(a==="portpick"){const f=$("#portraitFile");f.value="";f.click()}
  else if(a==="portdel"){editChar(myCid(),c=>{delete c.portrait});toast("Bild entfernt.")}
  else if(a==="wins"){const n=+b.dataset.d;if(n<=1){if(panes.length>1)tab=panes[activePane];panes=[]}else{let cur=panes.length>1?panes.slice():[tab];const pref=[tab,"map","char","dice","dm","party","cat","camp","rules"];
      while(cur.length<n){const nx=pref.find(k=>!cur.includes(k));cur.push(nx)}panes=cur.slice(0,n);if(activePane>=n)activePane=0}
    savePanes();$("#view").innerHTML="";$("#view").classList.remove("split");render();drawMap()}
  else if(a==="pclose"){const i=+b.dataset.i;panes.splice(i,1);if(panes.length<2){tab=panes[0]||tab;panes=[]}activePane=0;savePanes();$("#view").innerHTML="";$("#view").classList.remove("split");render();drawMap()}
  else if(a==="whto"){wh.to=id;render()}
  else if(a==="whkind"){wh.kind=b.dataset.k;render()}
  else if(a==="whadd"){const e=allCatalog().find(x=>x.id===id);if(e){wh.items.push({cat:e.cat,name:e.name,price:e.price,entry:e});wh.q="";render()}}
  else if(a==="whrm"){wh.items.splice(+b.dataset.i,1);render()}
  else if(a==="whsend"){const title=($("#wh-title")||{}).value||"",body=($("#wh-body")||{}).value||"";let items=[];
    if(wh.kind==="loot"){const ed=Math.max(0,Math.round(+(($("#wh-ed")||{}).value||0)));items=wh.items.slice();if(ed)items.unshift({cat:"E",name:ed+" €$",amount:ed,price:ed});if(!items.length){toast("Wähle mindestens einen Gegenstand oder Eddies.");return}}
    else if(!title.trim()&&!body.trim()){toast("Schreib einen Betreff oder Text.");return}
    if(await sendWhisper(wh.to,{kind:wh.kind,title:title.trim(),body:body.trim(),items})){wh.items=[];wh.q="";["#wh-title","#wh-body"].forEach(q=>{const f=$(q);if(f)f.value=""});SFX.pick();toast(`Geheim an ${chars[wh.to].handle||chars[wh.to].name} gesendet.`);render()}}
  else if(a==="lootwh"){if(!lootDraft.length)return;const list=lootDraft.slice(),title=(LOOTCTX.find(x=>x[0]===lootCfg.ctx)||["","Fundstück"])[1];
    if(await sendWhisper(id,{kind:"loot",title,body:"",items:list.map(x=>({cat:x.cat,name:x.name,price:x.price||0,amount:x.amount||0,entry:x.entry||null}))})){lootDraft=[];SFX.pick();toast(`Beute geheim an ${chars[id].handle||chars[id].name} geschickt.`);render()}}
  else if(a==="whread"||a==="whlater"){const w=myWhispers.find(x=>x.id===id);if(w){w.read=true;renderWhisperModal();db.doc(`whispers/${me}/items/${id}`).set({...w,read:true}).catch(e=>toast(errMsg(e)))}}
  else if(a==="whtake"){const w=myWhispers.find(x=>x.id===id);if(!w||w.taken||!myCid())return;w.taken=true;w.read=true;renderWhisperModal();
    try{await db.doc(`whispers/${me}/items/${id}`).set({...w,taken:true,read:true});
      await editChar(myCid(),c=>{(w.items||[]).forEach(x=>{const e=x.entry||{cat:"G",name:x.name};if(x.cat==="E")c.eddies=(c.eddies||0)+(x.amount||0);else if(e.cat==="C")addItem(c,{name:e.name,qty:1,note:`Cyberware, nicht eingebaut · Humanity −${e.hl||0}`,entry:e});else if(e.cat==="A")addItem(c,{name:e.name,qty:1,note:`Armor ${e.zone==="head"?"Kopf":"Body"} SP ${e.sp} · ins Armor-Feld ziehen`,entry:e});else applyEntry(c,e)})});
      SFX.coin();toast("Angenommen. Alles liegt jetzt bei dir.")}catch(e){toast(errMsg(e))}render()}
  else if(a==="newchar"){creating=true;draft=null;render();window.scrollTo(0,0)}
  else if(a==="newcancel"){creating=false;draft=null;render()}
  else if(a==="selchar"){const cur=myCid();await editChar(id,x=>{x.active=true});if(cur&&cur!==id)await editChar(cur,x=>{x.active=false});toast("Charakter gewechselt.")}
  else if(a==="delmine"){
    if(delArm!=="m"+id){delArm="m"+id;b.textContent="Wirklich löschen?";setTimeout(()=>{if(delArm==="m"+id){delArm=null;render()}},4000);return}
    delArm=null;try{await db.doc("chars/"+id).delete();const rest=myChars().filter(([k])=>k!==id);if(id===myCid()&&rest.length)await editChar(rest[0][0],x=>{x.active=true});toast("Charakter gelöscht.")}catch(e){toast(errMsg(e))}
  }
  else if(a==="dstep"){draft.step=clamp(draft.step+d,1,4);render();window.scrollTo(0,0)}
  else if(a==="drole"){draft.role=b.dataset.k;STATS.forEach(([k],i)=>draft.stats[k]=ROLEDATA[draft.role].st[i]);render()}
  else if(a==="dsuggest"){STATS.forEach(([k],i)=>draft.stats[k]=ROLEDATA[draft.role].st[i]);render()}
  else if(a==="drandrole"||a==="drandall"){
    const ks=STATS.map(([k])=>k),st={};
    if(a==="drandall"){ks.forEach(k=>st[k]=SMIN);let left=POINTS-SMIN*ks.length;while(left>0){const k=pickOne(ks.filter(k=>st[k]<SMAX));st[k]++;left--}}
    else{ks.forEach((k,i)=>st[k]=ROLEDATA[draft.role].st[i]);const top=[...ks].sort((x,y)=>st[y]-st[x]).slice(0,2);
      for(let n=0;n<14;n++){const from=pickOne(ks.filter(k=>st[k]>SMIN&&!top.includes(k))),to=pickOne(ks.filter(k=>st[k]<SMAX));if(from&&to&&from!==to){st[from]--;st[to]++}}}
    draft.stats=st;render()}
  else if(a==="dname"){draft.name=pickOne(FIRST)+" "+pickOne(LAST);render()}
  else if(a==="dhandle"){draft.handle=pickOne(HANDLES);render()}
  else if(a==="dlp"){LP.forEach(([k,,o])=>draft.lp[k]=pickOne(o));render()}
  else if(a==="create"){
    const s=draft.stats,R=ROLEDATA[draft.role];if(!draft.name.trim()){toast("Gib deinem Charakter einen Namen.");draft.step=3;render();return}
    const lpText=LP.map(([k,l])=>`${l}: ${draft.lp[k]}`).join("\n");
    const c={owner:me,name:draft.name.trim(),handle:draft.handle.trim(),role:draft.role,stats:s,hpMax:hpMax(s),hp:hpMax(s),humMax:humMax(s),hum:humMax(s),eddies:500,
      skills:draftSkills(draft),weapons:R.w.map((w,i)=>({id:uid(),name:w[0],skill:w[1],dmg:w[2],rof:w[3],mag:w[4],ammo:w[4],slot:i===0?"hand":"ready"})),
      armor:{head:{sp:11,max:11,name:"Helmet"},body:{sp:11,max:11,name:"Light Armorjack"}},inventory:R.inv.map(i=>({id:uid(),name:i[0],qty:i[1],note:i[2]})),
      lifepath:draft.lp,ip:0,ipTotal:0,ipLog:[],roleRank:4,rep:0,cyberware:"",notes:"Fähigkeit: "+R.ab+"\n\nLebensweg\n"+lpText,updatedAt:Date.now()};
    const nid=uid();c.active=true;const old=myChars();
    write("chars/"+nid,()=>c).then(async()=>{for(const [oid] of old)await editChar(oid,x=>{x.active=false})});draft=null;creating=false;
  }
  else if(a==="hp")editChar(id,c=>{c.hp=clamp(c.hp+d,0,c.hpMax||hpMax(c.stats))});
  else if(a==="hum")editChar(id,c=>{c.hum=clamp(c.hum+d,0,c.humMax||humMax(c.stats))});
  else if(a==="dmstat")editChar(id,c=>{c.stats[b.dataset.k]=clamp((c.stats[b.dataset.k]||0)+d,1,10);c.hpMax=hpMax(c.stats);c.humMax=humMax(c.stats);c.hp=Math.min(c.hp,c.hpMax);c.hum=Math.min(c.hum,c.humMax)});
  else if(a==="invdel"){const i=+b.dataset.i;editChar(id,c=>{c.inventory.splice(i,1)});giveOpen=null}
  else if(a==="giveopen"){giveOpen=giveOpen===+b.dataset.i?null:+b.dataset.i;render()}
  else if(a==="give"){
    const i=+b.dataset.i,to=$("#giveTo-"+i).value,it=(myChar().inventory||[])[i];if(!it)return;
    const q=clamp(+$("#giveQty-"+i).value||1,1,it.qty);giveOpen=null;
    await editChar(myCid(),c=>{const x=c.inventory[i];if(!x||x.name!==it.name)return;x.qty-=q;if(x.qty<=0)c.inventory.splice(i,1)});
    await editChar(to,c=>addItem(c,{name:it.name,qty:q,note:it.note}));

/* ---------- Würfeln ---------- */
function rollerName(){const c=myChar();return c?(c.handle||c.name):(myName||"Du")}
function doRoll(){
  const results=Array.from({length:pick.count},()=>rnd(pick.die));
  const r={name:rollerName(),die:pick.die,results,mod:pick.mod,total:results.reduce((a,b)=>a+b,0)+pick.mod,formula:`${pick.count}W${pick.die}${pick.mod?(pick.mod>0?"+":"")+pick.mod:""}`,label:"",at:Date.now(),by:me};
  publish(r,isDM()&&pick.hidden);
}
function doCheck(){
  const c=myChar();if(!c)return;const k=$("#ck-stat").value;pick.stat=k;
  const sk=+$("#ck-skill").value||0,label=$("#ck-label").value.trim();
  rollCheck(c.stats[k]+sk,`1W10 + ${k} ${c.stats[k]}${sk?` + ${sk}`:""}`,label?`· ${label}`:`· ${k}-Check`);
}
function woundPen(c){if(!c)return 0;const hm=c.hpMax||hpMax(c.stats);return (c.hp||0)<Math.ceil(hm/2)?-2:0}
function rollCheck(mod,formula,label,who){
  const wc=!who&&myChar(),wp=woundPen(wc);if(wp){mod+=wp;formula+=" − 2 verwundet"}
  const base=rnd(10);let extra=0,flag="";
  if(base===10){extra=rnd(10);flag="crit"}else if(base===1){extra=rnd(10);flag="fumble"}
  const total=base+(flag==="crit"?extra:flag==="fumble"?-extra:0)+mod;
  publish({name:who||rollerName(),die:10,results:[base],extra,flag,mod,total,formula,label,at:Date.now(),by:me},isDM()&&pick.hidden);
}
function deathSave(){const c=myChar();if(!c)return;const pen=c.dsPen||0,base=rnd(10),total=base+pen,body=c.stats.BODY||0,ok=base!==10&&total<body;
  publish({name:rollerName(),die:10,results:[base],extra:0,flag:ok?"":"fumble",mod:pen,total,formula:`1W10${pen?" + "+pen+" Strafe":""} gegen BODY ${body}`,label:"· Death Save",note:ok?"Überlebt diese Runde":"Tot. Nur noch der DM kann entscheiden, ob es eine Rettung gibt.",at:Date.now(),by:me},false);
  editChar(myCid(),x=>{x.dsPen=(x.dsPen||0)+1})}
function rollDamage(w,who){
  const m=String(w.dmg).match(/(\d+)\s*[wWdD]\s*(\d+)\s*(?:([+-])\s*(\d+))?/);
  if(!m){toast("Schaden im Format 3W6 oder 2W6+2 angeben.");return}
  const n=clamp(+m[1],1,8),die=[4,6,8,10,12,20].includes(+m[2])?+m[2]:6,add=m[3]?(m[3]==="-"?-1:1)*+m[4]:0;
  const results=Array.from({length:n},()=>rnd(die));const sixes=die===6?results.filter(x=>x===6).length:0;
  const crit=sixes>=2,mod=add+(crit?5:0);
  publish({name:who||rollerName(),die,results,mod,total:results.reduce((a,b)=>a+b,0)+mod,flag:crit?"crit":"",note:crit?"Kritische Verletzung · +5 Schaden":"",formula:`${n}W${die}${add?(add>0?"+":"")+add:""}${crit?" +5 Krit":""}`,label:`· Schaden ${w.name}`,at:Date.now(),by:me},isDM()&&pick.hidden);
}
async function publish(r,hidden){
  if(hidden||mode!=="online"){playRoll(r,true);return}
  const ref=db.collection("rolls").doc();myRolls.add(ref.id);
  playRoll(r,true);
  try{await ref.set(r);
    if(rolls.length>=36)for(const old of rolls.slice(30))db.doc("rolls/"+old.id).delete().catch(()=>{});
  }catch(e){toast(errMsg(e))}
}

const queue=[];let playing=false,closeTimer=null;
function queueRoll(r){queue.push(r);if(!playing)next()}
function playRoll(r,own){queue.unshift({...r,_own:own});if(playing){finish(true)}else next()}
function next(){const r=queue.shift();if(!r){playing=false;return}playing=true;animate(r)}
function finish(skipClose){clearTimeout(closeTimer);if(!skipClose){$("#tray").hidden=true}playing=false;next()}

function polyEl(n){
  const P={4:"50,4 97,90 3,90",8:"50,2 96,50 50,98 4,50",10:"50,2 95,40 75,96 25,96 5,40",12:"50,2 97,36 79,94 21,94 3,36",20:"50,1 95,26 95,74 50,99 5,74 5,26",100:"50,2 95,40 75,96 25,96 5,40"};
  const inner={4:"",8:'<polyline class="inner" points="4,50 50,62 96,50"/><line class="inner" x1="50" y1="2" x2="50" y2="62"/><line class="inner" x1="50" y1="62" x2="50" y2="98"/>',
    10:'<polyline class="inner" points="5,40 50,58 95,40"/><line class="inner" x1="50" y1="2" x2="50" y2="58"/>',
    12:'<polygon class="inner" points="50,22 74,40 65,70 35,70 26,40"/>',
    20:'<polygon class="inner" points="50,22 80,70 20,70"/>',100:'<polyline class="inner" points="5,40 50,58 95,40"/><line class="inner" x1="50" y1="2" x2="50" y2="58"/>'};
  const d=document.createElement("div");d.className="pdie"+(n===100?" small":"");
  d.innerHTML=`<svg viewBox="0 0 100 100"><polygon points="${P[n]}" stroke-linejoin="round"/>${inner[n]||""}</svg><span class="val">?</span>`;
  return d;
}

function anim2d(r,all,dur,box){
  box.classList.remove("is3d");
  const els=all.map((v,i)=>{
    const isExtra=r.extra&&i===all.length-1;
    const el=r.die===6?cubeEl():polyEl(r.die);
    el.style.setProperty("--dur",dur+"ms");
    el.style.setProperty("--sx",(Math.random()*240-120)+"px");
    el.style.setProperty("--rx",(Math.random()*900+540)*(Math.random()<.5?-1:1)+"deg");
    el.style.setProperty("--ry",(Math.random()*900+540)*(Math.random()<.5?-1:1)+"deg");
    el.style.setProperty("--rz",(Math.random()*540+180)*(Math.random()<.5?-1:1)+"deg");
    if(isExtra)el.style.animationDelay=(dur*.55)+"ms";
    box.appendChild(el);return {el,v,delay:isExtra?dur*.55:0};
  });
  els.forEach(({el,v,delay})=>{
    if(r.die===6){
      const cube=el.querySelector(".cube");const [x,y]=FACE_ROT[v];
      const sx=360*(2+Math.floor(Math.random()*3))*(Math.random()<.5?-1:1),sy=360*(2+Math.floor(Math.random()*3))*(Math.random()<.5?-1:1);
      cube.style.transition="none";cube.style.transform=`rotateX(${Math.random()*360}deg) rotateY(${Math.random()*360}deg)`;
      void cube.offsetWidth;
      setTimeout(()=>{el.classList.add("rolling");cube.style.transition=`transform ${dur}ms cubic-bezier(.15,.75,.25,1)`;cube.style.transform=`rotateX(${x+sx}deg) rotateY(${y+sy}deg)`},delay);
      setTimeout(()=>cube.classList.add("landed"),delay+dur);
    }else{
      const val=el.querySelector(".val");const start=performance.now()+delay;
      el.style.animationDelay=delay+"ms";el.classList.add("rolling");
      let last=0;
      const tick=now=>{
        const p=(now-start)/dur;
        if(p<0){requestAnimationFrame(tick);return}
        if(p>=1){val.textContent=v;el.classList.add("landed");
          if(r.die===10&&r.flag&&el===els[0].el)el.classList.add(r.flag);return}
        const gap=40+Math.pow(p,2.2)*260;
        if(now-last>gap){last=now;val.textContent=rnd(r.die)}
        requestAnimationFrame(tick);
      };requestAnimationFrame(tick);
    }
  });
  return Math.max(...els.map(x=>x.delay))+dur;
}

/* ---------- 3D-Würfel (three.js) ---------- */
let three=null;const geoCache={},texCache={};
function initThree(){
  if(three!==null)return three;
  try{
    if(!window.THREE)throw 0;
    const canvas=document.createElement("canvas");
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.outputEncoding=THREE.sRGBEncoding;
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(34,2,0.1,200);
    scene.add(new THREE.HemisphereLight(0xb8a8ff,0x0a0614,0.42));
    const key=new THREE.DirectionalLight(0xffffff,0.95);key.position.set(5,14,6);key.castShadow=true;
    key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:40});key.shadow.radius=4;
    scene.add(key);
    const pink=new THREE.PointLight(0xff2e88,1.4,40);pink.position.set(-8,4,-4);scene.add(pink);
    const cyan=new THREE.PointLight(0x3fe6ff,1.1,40);cyan.position.set(8,3,5);scene.add(cyan);
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.ShadowMaterial({opacity:.5}));
    ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
    const grid=new THREE.GridHelper(80,80,0x3fe6ff,0x3fe6ff);grid.material.transparent=true;grid.material.opacity=.13;scene.add(grid);
    three={renderer,scene,camera,canvas,dice:[],raf:0,plane:new THREE.PlaneGeometry(1,1)};
  }catch(e){three=false}
  return three;
}
function d10Geo(){
  const c=0.105,h=0.9946,S=1.15,V=[];
  for(let i=0;i<10;i++){const a=i*Math.PI/5;V.push(new THREE.Vector3(Math.cos(a),i%2?-c:c,Math.sin(a)).multiplyScalar(S))}
  const top=new THREE.Vector3(0,h*S,0),bot=new THREE.Vector3(0,-h*S,0),tris=[];
  for(let k=0;k<5;k++){
    const u0=V[2*k],l0=V[2*k+1],u1=V[(2*k+2)%10],l1=V[(2*k+3)%10];
    tris.push([top,u0,l0],[top,l0,u1],[bot,l0,u1],[bot,u1,l1]);
  }
  const pos=[];
  tris.forEach(([a,b,cc])=>{const n=new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(cc,a));const m=a.clone().add(b).add(cc);if(n.dot(m)<0)[b,cc]=[cc,b];pos.push(a.x,a.y,a.z,b.x,b.y,b.z,cc.x,cc.y,cc.z)});
  const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));return g;
}
function facesOf(g){
  const p=g.attributes.position,faces=[],A=new THREE.Vector3(),B=new THREE.Vector3(),C=new THREE.Vector3();
  for(let i=0;i<p.count;i+=3){
    A.fromBufferAttribute(p,i);B.fromBufferAttribute(p,i+1);C.fromBufferAttribute(p,i+2);
    const n=new THREE.Vector3().subVectors(B,A).cross(new THREE.Vector3().subVectors(C,A)).normalize();
    let f=faces.find(f=>f.n.dot(n)>0.995);if(!f){f={n,pts:[]};faces.push(f)}
    [A,B,C].forEach(v=>{if(!f.pts.some(q=>q.distanceTo(v)<1e-4))f.pts.push(v.clone())});
  }
  faces.forEach(f=>{f.c=f.pts.reduce((s,v)=>s.add(v),new THREE.Vector3()).divideScalar(f.pts.length);
    f.size=Math.min(...f.pts.map(v=>v.distanceTo(f.c)))*1.15});
  return faces;
}
function dieGeo(type){
  if(geoCache[type])return geoCache[type];
  let g;
  if(type===4)g=new THREE.TetrahedronGeometry(1.35);
  else if(type===6)g=new THREE.BoxGeometry(1.55,1.55,1.55);
  else if(type===8)g=new THREE.OctahedronGeometry(1.2);
  else if(type===12)g=new THREE.DodecahedronGeometry(1.15);
  else if(type===20)g=new THREE.IcosahedronGeometry(1.2);
  else g=d10Geo();
  if(g.index)g=g.toNonIndexed();
  g.computeVertexNormals();
  return geoCache[type]={g,faces:facesOf(g),edges:new THREE.EdgesGeometry(g,10)};
}
function numTex(txt,color){
  const k=txt+color;if(texCache[k])return texCache[k];
  const cv=document.createElement("canvas");cv.width=cv.height=128;const x=cv.getContext("2d");
  const fs=txt.length>2?50:txt.length>1?62:80;
  x.font=`700 ${fs}px "Chakra Petch","Arial Narrow",Arial,sans-serif`;x.textAlign="center";x.textBaseline="middle";
  x.shadowColor=color;x.shadowBlur=10;x.fillStyle=color;x.fillText(txt,64,66);
  if(txt==="6"||txt==="9"){x.shadowBlur=4;x.fillRect(44,66+fs*.42,40,6)}
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
  let ok=true;try{ok=document.fonts.check(`700 ${fs}px "Chakra Petch"`)}catch(e){}
  if(ok)texCache[k]=t;return t;
}
function roll3d(T,r,all,dur,box){
  const {scene,camera,renderer}=T;
  box.classList.add("is3d");box.innerHTML="";box.appendChild(T.canvas);
  const W=box.clientWidth||600,H=box.clientHeight||280;
  renderer.setSize(W,H,false);camera.aspect=W/H;
  cancelAnimationFrame(T.raf);
  T.dice.forEach(d=>{scene.remove(d.obj);d.mats.forEach(m=>m.dispose())});T.dice=[];
  const specs=[];
  all.forEach((v,i)=>{
    const isExtra=r.extra&&i===all.length-1,delay=isExtra?dur*.5:0,flag=(i===0&&r.flag)?r.flag:"";
    if(r.die===100){
      const tens=Math.floor((v%100)/10)*10,u=v%10;
      specs.push({type:10,labels:[...Array(10)].map((_,k)=>String(k*10).padStart(2,"0")),val:String(tens).padStart(2,"0"),delay});
      specs.push({type:10,labels:[...Array(10)].map((_,k)=>String(k)),val:String(u),delay:delay+90});
    }else specs.push({type:r.die,labels:[...Array(r.die)].map((_,k)=>String(k+1)),val:String(v),delay,flag});
  });
  // Kamera passend zur Anzahl
  const n=specs.length,sp=2.9,cols=Math.min(n,4),rows=Math.ceil(n/4),tan=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const dist=Math.max(8.5,Math.max((cols*sp/2+1.4)/(tan*camera.aspect),(rows*sp/2+1.6)/tan)*1.12);
  camera.position.set(0,0.84,0.54).normalize().multiplyScalar(dist);camera.lookAt(0,0.9,0);camera.updateProjectionMatrix();camera.updateMatrixWorld();
  const camUp=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
  const Z=new THREE.Vector3(0,0,1),Y=new THREE.Vector3(0,1,0);
  specs.forEach((s,i)=>{
    const G=dieGeo(s.type);
    const mat=new THREE.MeshStandardMaterial({color:0x150e30,metalness:.55,roughness:.28,flatShading:true,emissive:0x0e0824});
    const lineMat=new THREE.LineBasicMaterial({color:0x3fe6ff});
    const mesh=new THREE.Mesh(G.g,mat);mesh.castShadow=true;
    const obj=new THREE.Group();obj.add(mesh,new THREE.LineSegments(G.edges,lineMat));
    const mats=[mat,lineMat];let hit=null;
    G.faces.forEach((f,k)=>{
      const lbl=s.labels[k%s.labels.length];
      const pm=new THREE.MeshBasicMaterial({map:numTex(lbl,"#efe9ff"),transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2});mats.push(pm);
      const pl=new THREE.Mesh(T.plane,pm);pl.scale.setScalar(f.size);
      pl.position.copy(f.c).addScaledVector(f.n,0.012);pl.quaternion.setFromUnitVectors(Z,f.n);
      obj.add(pl);if(!hit&&lbl===s.val)hit={pl,pm,f,lbl};
    });
    const row=Math.floor(i/4),inRow=Math.min(4,n-row*4),col=i%4;
    const rest=new THREE.Vector3((col-(inRow-1)/2)*sp,0,(row-(rows-1)/2)*sp);
    // Ergebnisfläche zur Kamera drehen, Zahl aufrecht
    const d=camera.position.clone().sub(rest).normalize().multiplyScalar(.6).add(new THREE.Vector3(0,.4,0)).normalize();
    const up=camUp.clone().sub(d.clone().multiplyScalar(camUp.dot(d))).normalize();
    const fn=hit.f.n.clone(),fu=Y.clone().applyQuaternion(hit.pl.quaternion);
    const Ms=new THREE.Matrix4().makeBasis(fu.clone().cross(fn),fu,fn);
    const Mt=new THREE.Matrix4().makeBasis(up.clone().cross(d),up,d);
    const qT=new THREE.Quaternion().setFromRotationMatrix(Mt.multiply(Ms.transpose()));
    const pa=G.g.attributes.position,tv=new THREE.Vector3();let minY=Infinity;
    for(let k=0;k<pa.count;k++){tv.fromBufferAttribute(pa,k).applyQuaternion(qT);minY=Math.min(minY,tv.y)}
    rest.y=-minY;
    const side=Math.random()<.5?-1:1;
    const glow=new THREE.PointLight(0xf5e400,0,8);glow.position.set(0,1.5,0);obj.add(glow);
    const die={obj,mats,mat,lineMat,hit,glow,flag:s.flag,qT,rest,delay:s.delay,landed:false,
      x0:rest.x+side*(6+Math.random()*3),z0:rest.z-3-Math.random()*3,
      axis:new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize(),
      spin:(5+Math.random()*4)*Math.PI};
    obj.visible=false;scene.add(obj);T.dice.push(die);
  });
  const bounce=t=>{if(t<.32){const u=t/.32;return 8*(1-u*u)}
    for(const [a,b,h] of [[.32,.56,1.5],[.56,.74,.55],[.74,.86,.18],[.86,.94,.05]])if(t<b){const u=(t-a)/(b-a);return h*4*u*(1-u)}return 0};
  const t0=performance.now(),last=Math.max(...T.dice.map(d=>d.delay))+dur,q=new THREE.Quaternion();
  const loop=now=>{
    T.dice.forEach(d=>{
      const t=(now-t0-d.delay)/dur;if(t<0)return;d.obj.visible=true;
      const tc=Math.min(t,1),e=1-Math.pow(1-tc,3);
      d.obj.position.set(d.x0+(d.rest.x-d.x0)*e,d.rest.y+bounce(tc),d.z0+(d.rest.z-d.z0)*e);
      q.setFromAxisAngle(d.axis,d.spin*Math.pow(1-tc,2.2));d.obj.quaternion.copy(d.qT).multiply(q);
      d.bi=d.bi||0;const BS=[.32,.56,.74,.86];while(d.bi<BS.length&&tc>=BS[d.bi]){SFX.clack(1-d.bi*.22);d.bi++}
      if(tc>=1&&!d.landed){SFX.land();
        d.landed=true;const col=d.flag==="crit"?0x5dffa0:d.flag==="fumble"?0xff4f5e:0xf5e400;
        d.lineMat.color.setHex(col);d.mat.emissive.setHex(col).multiplyScalar(.05);d.glow.color.setHex(col);
        d.hit.pm.map=numTex(d.hit.lbl,"#"+col.toString(16).padStart(6,"0"));d.hit.pm.needsUpdate=true;
        d.landT=now;
      }
      if(d.landed){const k=(now-d.landT)/700;d.glow.intensity=k<1?1.1*(1-k)+.3*k:.3;d.obj.scale.setScalar(k<.25?1+.08*Math.sin(k/.25*Math.PI):1)}
    });
    renderer.render(scene,camera);
    if(now<t0+last+900&&!$("#tray").hidden)T.raf=requestAnimationFrame(loop);
  };
  T.raf=requestAnimationFrame(loop);
  return last;
}

let gen=0;
function animate(r){
  const my=++gen;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur=reduce?250:1500+Math.random()*300;
  $("#tray").hidden=false;
  $("#trayWho").textContent=(r._own?"Du würfelst":`${r.name} würfelt`)+(r.label?" "+r.label:"");
  $("#trayTotal").textContent="";$("#trayTotal").className="tray-total";
  $("#trayNote").textContent="";$("#trayNote").className="tray-note";$("#traySub").textContent=r.formula;
  const box=$("#trayDice");box.innerHTML="";
  const all=[...r.results];if(r.extra)all.push(r.extra);
  const T3=initThree();
  if(T3)SFX.whoosh();else SFX.roll();
  const endAt=T3?roll3d(T3,r,all,reduce?400:dur+400,box):anim2d(r,all,dur,box);
  setTimeout(()=>{
    if(my!==gen)return;
    const tt=$("#trayTotal");tt.textContent=r.total;tt.classList.add("glitch");
    const n=$("#trayNote");
    if(!T3)SFX.land();if(r.flag==="crit")SFX.crit();else if(r.flag==="fumble")SFX.fumble();
    if(r.note){n.textContent=r.note;if(r.flag)n.classList.add(r.flag)}
    else if(r.flag==="crit"){n.textContent="Critical Success · +"+r.extra;n.classList.add("crit")}
    else if(r.flag==="fumble"){n.textContent="Fumble · −"+r.extra;n.classList.add("fumble")}
    else if(all.length>1||r.mod){n.textContent=all.join(" + ")+(r.mod?` ${r.mod>0?"+":"−"} ${Math.abs(r.mod)}`:"")}
    closeTimer=setTimeout(()=>finish(!!queue.length?true:false),queue.length?2200:(r._own?6000:3500));
  },endAt+80);
}
